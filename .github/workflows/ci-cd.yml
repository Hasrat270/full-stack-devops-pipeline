name: DevOps CI/CD Pipeline & AWS EC2 Deployment

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:


jobs:
  test-and-lint:
    name: 🧪 Test & Static Analysis
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Skip Unit Tests in CI
        run: echo "Skipping unit tests in CI"




  build-and-push-docker:
    name: 🐳 Docker Container Build & Push to GHCR
    needs: test-and-lint
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry (GHCR)
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}


      - name: Build & Push Web Frontend Container Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: ${{ github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master' }}
          tags: ghcr.io/hasrat270/full-stack-devops-pipeline-web:latest

      - name: Build & Push Backend API Container Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile.api
          push: ${{ github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master' }}
          tags: ghcr.io/hasrat270/full-stack-devops-pipeline-backend:latest


  deploy-to-aws-ec2:
    name: ☁️ Deploy Containers to AWS EC2 via SSH & Docker Compose
    needs: build-and-push-docker
    if: (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master') && secrets.EC2_HOST != ''
    runs-on: ubuntu-latest
    steps:
      - name: Execute Docker Compose Deployment over SSH
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            echo "${{ secrets.GHCR_TOKEN }}" | docker login ghcr.io -u ${{ secrets.EC2_USERNAME }} --password-stdin
            cd ~/app || mkdir -p ~/app && cd ~/app
            docker compose pull
            docker compose up -d --remove-orphans
            docker image prune -f

