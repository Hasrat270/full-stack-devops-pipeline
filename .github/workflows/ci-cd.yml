name: DevOps CI/CD Pipeline & AWS EC2 Deployment

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  test-and-lint:
    name: 🧪 Test & Static Analysis
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js & pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 11

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Run Static Code Analysis (Oxlint)
        run: pnpm run lint

      - name: Execute Automated Test Suite (Vitest)
        run: pnpm run test:ci

  build-and-push-docker:
    name: 🐳 Docker Container Build & Push to GHCR
    needs: test-and-lint
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry (GHCR)
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Lowercase Repository Name
        run: |
          echo "REPO_LOWER=${GITHUB_REPOSITORY,,}" >> $GITHUB_ENV

      - name: Build & Push Web Frontend Container Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: ${{ github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master' }}
          tags: ghcr.io/${{ env.REPO_LOWER }}-web:latest

      - name: Build & Push Backend API Container Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile.api
          push: ${{ github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master' }}
          tags: ghcr.io/${{ env.REPO_LOWER }}-backend:latest

  deploy-to-aws-ec2:
    name: ☁️ Deploy Containers to AWS EC2 via SSH & Docker Compose
    needs: build-and-push-docker
    if: (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master') && secrets.EC2_HOST != ''
    runs-on: ubuntu-latest
    steps:
      - name: Execute Docker Compose Deployment over SSH
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            echo "${{ secrets.GHCR_TOKEN }}" | docker login ghcr.io -u ${{ secrets.EC2_USERNAME }} --password-stdin
            cd ~/app || mkdir -p ~/app && cd ~/app
            docker compose pull
            docker compose up -d --remove-orphans
            docker image prune -f

